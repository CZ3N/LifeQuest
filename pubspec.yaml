# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: Life Quest — a quest-based life tracking and gamification app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. Left enabled in the deployed build on purpose — see
  # lib/main.dart and START-HERE.md for why.
  device_preview: ^1.3.1
  # Local persistence for the MVP. See docs/01-proposal.md, "My Choice":
  # Life Quest is a single-user app with a small dataset, so a key-value
  # store is enough and a cloud backend is not required.
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Put images, fonts and sounds in assets/ and list them here, for example:
  # assets:
  #   - assets/images/
