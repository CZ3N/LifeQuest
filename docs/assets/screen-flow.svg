<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
 <rect width="1000" height="650" fill="#F5F7F5"/>
 <text x="45" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#263238">Life Quest — Screen Flow</text>
 <g font-family="Arial,sans-serif" font-size="17" text-anchor="middle">
  <rect x="370" y="90" width="260" height="58" rx="14" fill="#2E7D32"/><text x="500" y="126" fill="#FFFFFF">App Launch</text>
  <path d="M500 148 V180" stroke="#60716A" stroke-width="3"/><path d="M492 172 L500 182 L508 172" fill="none" stroke="#60716A" stroke-width="3"/>
  <rect x="370" y="185" width="260" height="62" rx="14" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/><text x="500" y="222" fill="#263238">1. Dashboard</text>
  <path d="M500 247 V277 H180 V305 M500 277 H500 V305 M500 277 H820 V305" fill="none" stroke="#60716A" stroke-width="3"/>
  <path d="M172 297 L180 307 L188 297 M492 297 L500 307 L508 297 M812 297 L820 307 L828 297" fill="none" stroke="#60716A" stroke-width="3"/>
  <rect x="65" y="310" width="230" height="70" rx="14" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/><text x="180" y="339" fill="#263238">2. Quest List</text><text x="180" y="362" font-size="14" fill="#60716A">Search and filters</text>
  <rect x="385" y="310" width="230" height="70" rx="14" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/><text x="500" y="339" fill="#263238">5. Profile &amp; Stats</text><text x="500" y="362" font-size="14" fill="#60716A">XP, level, badges</text>
  <rect x="705" y="310" width="230" height="70" rx="14" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/><text x="820" y="339" fill="#263238">3. Quest Detail</text><text x="820" y="362" font-size="14" fill="#60716A">View, complete, edit</text>
  <path d="M295 345 H330 V440 H400 M820 380 V440 H600 M500 380 V440" fill="none" stroke="#60716A" stroke-width="3"/>
  <rect x="330" y="445" width="340" height="72" rx="14" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="500" y="474" fill="#263238">4. Add / Edit Quest</text><text x="500" y="498" font-size="14" fill="#60716A">Create or update a quest</text>
  <text x="500" y="565" fill="#263238" font-size="15">Detail and Add/Edit are pushed routes, not extra bottom-nav tabs.</text>
  <text x="500" y="600" fill="#60716A" font-size="14">Illustrative navigation diagram, not a screenshot of the running app.</text>
 </g>
</svg>
