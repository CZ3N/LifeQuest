    <rect x="475" y="248" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#CFD8D3"/><text x="490" y="375">Surface</text><text x="490" y="397">#FFFFFF</text>
    <rect x="685" y="248" width="190" height="100" rx="14" fill="#263238"/><text x="700" y="375">Main text</text><text x="700" y="397">#263238</text>
