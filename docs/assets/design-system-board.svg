  <text x="55" y="663" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#263238">Design principles</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#263238">
    <circle cx="70" cy="704" r="7" fill="#2E7D32"/><text x="90" y="710">Progress should be visible at a glance.</text>
    <circle cx="70" cy="740" r="7" fill="#2E7D32"/><text x="90" y="746">Keep quest creation and completion simple.</text>
    <circle cx="620" cy="704" r="7" fill="#2E7D32"/><text x="640" y="710">Use consistent cards, spacing, and status cues.</text>
    <circle cx="620" cy="740" r="7" fill="#2E7D32"/><text x="640" y="746">Light mode and green brand direction for MVP.</text>
  </g>
  <text x="55" y="790" font-family="Arial, sans-serif" font-size="13" fill="#60716A">Reference board based on documented Life Quest tokens; confirm against final Flutter theme before submission.</text>
