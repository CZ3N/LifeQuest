  <text x="80" y="520" font-family="Arial, sans-serif" font-size="14" fill="#60716A">HEADLINE SMALL / 24 PX / BOLD</text>
  <text x="80" y="563" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#263238">Your next quest awaits</text>
  <text x="80" y="590" font-family="Arial, sans-serif" font-size="16" fill="#263238">Body Medium / 16 px / regular</text>
  <rect x="590" y="477" width="495" height="132" rx="18" fill="#FFFFFF" stroke="#DCE4DE"/>
  <text x="615" y="520" font-family="Arial, sans-serif" font-size="14" fill="#60716A">COMPONENT EXAMPLES</text>
